name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets a stuck/skipped release be manually re-flushed against the CURRENT tip of main (see
  # get-version's ref: main checkout below) - a plain "Re-run jobs" on an old push-triggered
  # run reuses that run's original, by-then-stale github.sha and can never succeed once main has
  # moved past it.
  workflow_dispatch:

# One queue entry per ref (or per PR number, so successive pushes to the same PR don't queue
# behind each other) - the whole run (lint/test/get-version/docker/trivy/semantic-release) is a
# single atomic unit instead of several jobs independently competing for the same job-level
# lock. Only PR runs get cancelled by a newer push to the same PR (fast feedback); a
# push-to-main run is never cancelled mid-flight, so a release can't be interrupted partway
# through.
concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # uv must never download an interpreter from python-build-standalone: that is an
  # external fetch on every single run (it started returning 504 Gateway Timeout on
  # 2026-09-14 and turned CI red at random). The runner's tool cache already ships the
  # version below, resolved locally by actions/setup-python - and with downloads off a
  # missing interpreter fails loudly instead of being pulled in over the network.
  UV_PYTHON_DOWNLOADS: never
  IMAGE: ghcr.io/lukislp/github-dashboard

# Least-privilege default for GITHUB_TOKEN (CodeQL actions/missing-workflow-permissions):
# jobs that need more declare it themselves.
permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.5.8"
          cache-suffix: "lint"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run ruff check app tests fuzz
      - run: uv run ruff format --check app tests fuzz

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.5.8"
          cache-suffix: "test"
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run pytest -q

  # Atheris pass over the code that turns outside input into domain objects: the environment
  # loader and the codec round trips. fuzz/fuzz_parsers.py imports only app.domain and
  # app.infrastructure.settings, both standard library only, so this job installs atheris and
  # nothing else - no uv sync, no app dependencies.
  #
  # Deliberately NOT a release gate (get-version below does not wait for it), same as the
  # shared hacs-ci.yml: a fixed fuzz budget is a bounded search for new inputs, not a verdict
  # on this particular commit. A finding shows up as a red check to act on, not as a blocked
  # release.
  fuzz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements_fuzz.txt
      - run: pip install --require-hashes -r requirements_fuzz.txt
      - run: python fuzz/fuzz_parsers.py -max_total_time=30 -rss_limit_mb=1024
        env:
          PYTHONPATH: .

  # ---------------------------------------------------------------------
  # Version / image / release - push to main only.
  # ---------------------------------------------------------------------
  get-version:
    needs: [lint, test]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # @semantic-release/github's verifyConditions step checks the token has repo push access
    # (contents: write) even during a dry run - a read-only token fails that check outright.
    # issues:write/pull-requests:write are NOT needed here: those only get exercised by the
    # publish/success/fail lifecycle steps, which dry_run: true skips entirely.
    permissions:
      contents: write
    outputs:
      next_version: ${{ steps.semrel.outputs.new_release_version }}
      published: ${{ steps.semrel.outputs.new_release_published }}
    steps:
      # ref: main (branch tip), NOT the push-event SHA: a "[skip ci]" bump or another merge
      # can land between the triggering push and this job actually running. semantic-release's
      # "local branch is behind the remote" guard then analyzes a stale SHA and releases
      # nothing - the entire release chain skips even though a releasable fix was just merged.
      # Analyzing the branch tip makes the verdict immune to that race. This also covers the
      # workflow_dispatch re-run case above: ref: main always resolves to the CURRENT tip
      # regardless of which run triggered this job.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      # Ruleset bypass for the release commit: main is protected by a ruleset (pull request +
      # green test stage) that the GitHub Actions app cannot be a bypass actor for on a
      # personal repository, so semantic-release pushes over SSH as a write-enabled DEPLOY KEY
      # instead, which can. No-op while the secret is unset - the push then goes through the
      # GITHUB_TOKEN https remote exactly as before. Needed in get-version too:
      # @semantic-release/git's verifyConditions runs `git push --dry-run` even in dry-run mode.
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@6359eceb62d0b73e016578fe970182a430aa0ba4 # v1.5.3
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@6359eceb62d0b73e016578fe970182a430aa0ba4 # v1.5.3
        with:
          dry-run: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: No release needed for this push
        if: steps.semrel.outputs.new_release_published != 'true'
        run: |
          echo "No releasable commits since the last tag (e.g. docs/ci/chore-only) - this is the expected, common case with Conventional Commits, not a failure. docker/trivy/semantic-release below skip themselves via needs.get-version.outputs.published." | tee -a "$GITHUB_STEP_SUMMARY"

  docker:
    # One native runner per platform instead of a single QEMU-emulated multi-platform build -
    # ubuntu-24.04-arm is a real arm64 GitHub-hosted runner (free for public repos), so that leg
    # runs at native speed. Each leg pushes by digest only; docker-manifest-merge below writes
    # the actual :latest/:$NEXT_VERSION tags. Runs after semantic-release (not before, see that
    # job) - a build/push failure here never leaves an orphaned, un-tagged GHCR image blocking
    # every future release via the duplicate-tag guard below.
    needs: [get-version, semantic-release]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.published == 'true'
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: amd64
            platform: linux/amd64
            runner: ubuntu-latest
          - arch: arm64
            platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      # ref: main to match get-version's analysis target - the artifact stamped with the next
      # version must be built from the same tree that version was computed for, not from an
      # event SHA that may be a [skip ci] bump behind it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Guard against duplicate tag
        run: |
          if docker manifest inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" >/dev/null 2>&1; then
            echo "::error::registry tag ${{ env.NEXT_VERSION }} already exists (version race with a parallel run). Do NOT retry this run; wait for it to finish, then push again to produce a fresh version."
            exit 1
          fi
      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=app-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=app-${{ matrix.arch }}
          # Supply chain: BuildKit attaches a SLSA provenance attestation (which commit/
          # workflow built this, from which base image) and an SPDX SBOM to every per-arch
          # image. They travel as extra "unknown/unknown" platform entries inside the pushed
          # index - GHCR shows them as such, containerd/k3s ignore them when pulling, Trivy
          # resolves the real linux/amd64 entry. imagetools create below carries them into the
          # multi-arch manifest unchanged.
          provenance: mode=max
          sbom: true
      - name: Export digest
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digests-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  docker-manifest-merge:
    needs: [get-version, docker]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      # OIDC token for Sigstore keyless signing (cosign sign below) - no key material anywhere.
      id-token: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Create and push the multi-arch manifest
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            -t "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" \
            -t "${{ env.IMAGE }}:latest" \
            $(printf "${{ env.IMAGE }}@sha256:%s " *)
      - name: Inspect the pushed manifest
        run: docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}"
      # Sigstore keyless signature on the multi-arch manifest DIGEST, so every tag pointing at
      # it (version, latest) is covered by one signature. The signing identity is this
      # workflow's OIDC certificate (repo + workflow path + ref); the signature and the
      # transparency-log entry live next to the image in GHCR. The verify step right after is
      # the live proof for this run and the exact identity constraint documented in the README.
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Sign the multi-arch manifest (Sigstore keyless) and verify
        env:
          IDENTITY_REGEXP: '^https://github\.com/lukislp/github-dashboard/\.github/workflows/ci\.yml@refs/heads/main$'
        run: |
          DIGEST="$(docker buildx imagetools inspect "${{ env.IMAGE }}:${{ env.NEXT_VERSION }}" --format '{{json .Manifest.Digest}}' | tr -d '"')"
          cosign sign --yes "${{ env.IMAGE }}@${DIGEST}"
          cosign verify \
            --certificate-identity-regexp "$IDENTITY_REGEXP" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            "${{ env.IMAGE }}@${DIGEST}" --output text >/dev/null
          echo "signed and verified ${{ env.IMAGE }}@${DIGEST}" | tee -a "$GITHUB_STEP_SUMMARY"

  trivy:
    needs: [get-version, docker-manifest-merge]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
      security-events: write
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"
      - name: Upload SARIF results
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: sarif
          output: trivy-results.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63 # v4.38.0
        if: always()
        with:
          sarif_file: trivy-results.sarif
      - name: Gate on CRITICAL
        # A CRITICAL finding with an available fix blocks the rollout (deploy-bump needs this
        # job); unfixed ones are reported above but cannot be acted on yet.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.IMAGE }}:${{ env.NEXT_VERSION }}
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  semantic-release:
    # Runs before docker (see that job's comment) - the real tag/release must exist before
    # anything is published under that version.
    needs: [get-version]
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      # ref: main for the same reason as get-version's checkout: the real release must be cut
      # from the branch tip get-version analyzed, or the "behind the remote" guard trips on the
      # event SHA whenever another push raced in. The retry below still covers a push landing
      # DURING this job (i.e. after this checkout, before this job's own push).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: main
      - name: Push as the semantic-release deploy key (if configured)
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@6359eceb62d0b73e016578fe970182a430aa0ba4 # v1.5.3
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
      - id: semrel
        uses: lukislp/ci-workflows/.github/actions/semantic-release@6359eceb62d0b73e016578fe970182a430aa0ba4 # v1.5.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true
      # Retry once for the narrow window where an out-of-band push to main landed between this
      # job's checkout and its own push.
      - if: steps.semrel.outcome == 'failure'
        name: "Diagnose before retrying (expected: an out-of-band push landed since checkout)"
        run: |
          git fetch origin main
          BEFORE_SHA="$(git rev-parse HEAD)"
          AFTER_SHA="$(git rev-parse origin/main)"
          if [ "$BEFORE_SHA" != "$AFTER_SHA" ]; then
            echo "origin/main moved since checkout ($BEFORE_SHA -> $AFTER_SHA) - this matches the out-of-band-push race this retry is designed for."
          else
            echo "::warning::origin/main did NOT move since checkout - this failure is likely NOT the expected out-of-band-push race. Retrying anyway, but check the semantic-release log above for the real cause before assuming this is just a race."
          fi
          git checkout -B main origin/main
      - if: steps.semrel.outcome == 'failure'
        uses: lukislp/ci-workflows/.github/actions/semantic-release@6359eceb62d0b73e016578fe970182a430aa0ba4 # v1.5.3
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # Writes the released image tag into the Flux-managed manifests under k8s/ (nothing in the
  # cluster pushes to this repo, so this is the only way a release reaches the Deployment),
  # pushing over the same deploy key semantic-release uses.
  deploy-bump:
    needs: [get-version, docker-manifest-merge, trivy]
    if: github.event_name == 'push' && needs.get-version.outputs.published == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: github-dashboard-release-chain
      cancel-in-progress: false
    permissions:
      contents: read
    env:
      NEXT_VERSION: ${{ needs.get-version.outputs.next_version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
      # Same deploy-key push as the release jobs - the default branch only takes direct pushes
      # from that key, so this job cannot fall back to GITHUB_TOKEN.
      - name: Push as the semantic-release deploy key
        uses: lukislp/ci-workflows/.github/actions/deploy-key-push@6359eceb62d0b73e016578fe970182a430aa0ba4 # v1.5.3
        with:
          deploy-key: ${{ secrets.SEMANTIC_RELEASE_DEPLOY_KEY }}
          required: "true"
      - name: Point the manifests at the released image and push
        run: |
          set -eu
          for f in $(grep -rlE 'ghcr\.io/lukislp/github-dashboard:' k8s --include='*.yaml' | grep -v '/flux/'); do
            sed -i -E "s#(ghcr\.io/lukislp/github-dashboard):[0-9A-Za-z._-]+#\1:${NEXT_VERSION}#g" "$f"
          done
          if git diff --quiet; then
            echo "manifests already reference ${NEXT_VERSION}"
            exit 0
          fi
          git diff --stat
          git config user.name "github-dashboard-deploy"
          git config user.email "deploy@studylife.local"
          git commit -am "chore(deploy): image ${NEXT_VERSION} [skip ci]"
          # The branch may have moved (an out-of-band push) between checkout and now - rebase, retry.
          for attempt in 1 2 3; do
            git push origin HEAD:main && exit 0
            git fetch origin main
            git rebase origin/main
          done
          echo "::error::could not push the image tag bump"
          exit 1

# secrets: SEMANTIC_RELEASE_DEPLOY_KEY (repository secret, a write-enabled SSH deploy key) is
# required for get-version/semantic-release/deploy-bump to push to the protected main branch.
# Without it those steps no-op and fall back to the read-only GITHUB_TOKEN, which cannot push
# past the branch ruleset.
