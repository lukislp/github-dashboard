name: Dependabot lock files

# Thin caller of the shared implementation in lukislp/ci-workflows: regenerates uv.lock on
# Dependabot's own PRs with the CI tool versions and pushes it back onto the PR branch. Plain
# pull_request on purpose (never pull_request_target); AUTOMERGE_TOKEN is stored as a
# Dependabot secret, which only Dependabot-triggered runs can read.
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read

jobs:
  lockfiles:
    uses: lukislp/ci-workflows/.github/workflows/dependabot-lockfiles.yml@4b19e87569c767e2855b4a53292d8edfe4065de4 # v1.8.3
    with:
      uv-version: "0.12.18"
    secrets:
      AUTOMERGE_TOKEN: ${{ secrets.AUTOMERGE_TOKEN }}
      DEPLOY_SIGNING_KEY: ${{ secrets.DEPLOY_SIGNING_KEY }}
