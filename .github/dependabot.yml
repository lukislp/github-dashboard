# Weekly Dependabot updates: GitHub Actions, uv (pyproject + uv.lock) and the Dockerfile.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(ci)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(deps)"
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: daily
    commit-message:
      prefix: "fix(docker)"
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-minor", "version-update:semver-major"]
    reviewers:
      - "lukislp"
    open-pull-requests-limit: 2
