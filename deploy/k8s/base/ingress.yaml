# Adjust host, ingress class and TLS issuer to your cluster.
# BASE_URL in the Secret must match this host (https://dashboard.example.com).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: github-dashboard
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt
spec:
  ingressClassName: nginx
  tls:
    - hosts: ["dashboard.example.com"]
      secretName: github-dashboard-tls
  rules:
    - host: dashboard.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: github-dashboard
                port:
                  name: http
