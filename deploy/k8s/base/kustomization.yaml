apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: github-dashboard

resources:
  - namespace.yaml
  - pvc.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

# The Secret is intentionally not part of the base. Create it from secret.example.yaml
# (or a SealedSecret / ExternalSecret) before applying.

images:
  - name: ghcr.io/lukislp/github-dashboard
    newTag: latest
