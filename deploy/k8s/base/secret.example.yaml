# Template only. Create the real Secret out of band, e.g.
#   kubectl -n github-dashboard create secret generic github-dashboard-secrets \
#     --from-literal=GITHUB_CLIENT_ID=... --from-literal=GITHUB_CLIENT_SECRET=... \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')" \
#     --from-literal=BASE_URL=https://dashboard.example.com
# or seal it with kubeseal / manage it with an ExternalSecret.
apiVersion: v1
kind: Secret
metadata:
  name: github-dashboard-secrets
  namespace: github-dashboard
type: Opaque
stringData:
  GITHUB_CLIENT_ID: ""
  GITHUB_CLIENT_SECRET: ""
  SECRET_KEY: ""
  BASE_URL: "https://dashboard.example.com"
  # ALLOWED_LOGINS: ""
  # REDIS_URL: "redis://redis.github-dashboard.svc:6379/0"
