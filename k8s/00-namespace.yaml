# Dedicated namespace. Pod Security Standards "restricted" is hard-enforced: the Deployment in
# k8s/03-app.yaml runs as a fixed non-root uid, drops all capabilities, has a read-only root
# filesystem and a RuntimeDefault seccomp profile, so nothing here needs the looser "baseline".
#
# NOT applied via Flux: kustomize-controller's least-privilege ClusterRole (homelab-infra's
# flux/01-reconciler-rbac.yaml) grants no permission on the "namespaces" resource - only
# Deployments/ConfigMaps/Services/PersistentVolumeClaims. Bootstrap-only, applied once by hand
# (kubectl apply -f k8s/00-namespace.yaml), same split as every other app on this cluster.
apiVersion: v1
kind: Namespace
metadata:
  name: github-dashboard
  labels:
    pod-security.kubernetes.io/enforce: restricted
    pod-security.kubernetes.io/warn: restricted
    pod-security.kubernetes.io/audit: restricted
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: default
  namespace: github-dashboard
automountServiceAccountToken: false
