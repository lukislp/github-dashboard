# Template only - the values below are obvious placeholders, publicly visible in this repo.
# The real Secret for this cluster is k8s/02-sealed-secret.yaml, produced by k8s/seal-secret.sh
# (Bitnami Sealed Secrets, encrypted with the cluster controller's public key, safe to commit).
# Anyone adapting this for another cluster either runs that script against their own
# sealed-secrets controller or creates the Secret out of band:
#   kubectl -n github-dashboard create secret generic github-dashboard-secrets \
#     --from-literal=GITHUB_CLIENT_ID=... --from-literal=GITHUB_CLIENT_SECRET=... \
#     --from-literal=SECRET_KEY="$(python -c 'import secrets; print(secrets.token_urlsafe(48))')"
#
# Bootstrap-only, NOT Flux-managed: kustomize-controller's ClusterRole has no permission on
# "secrets" (deliberately). Applied once by hand.
apiVersion: v1
kind: Secret
metadata:
  name: github-dashboard-secrets
  namespace: github-dashboard
type: Opaque
stringData:
  # From the GitHub OAuth App (Settings -> Developer settings -> OAuth Apps).
  GITHUB_CLIENT_ID: "REPLACE-ME"
  GITHUB_CLIENT_SECRET: "REPLACE-ME"
  # Signs cookies and encrypts the stored GitHub tokens (Fernet). Rotating it invalidates every
  # session - users simply sign in again.
  SECRET_KEY: "REPLACE-ME-WITH-AT-LEAST-32-RANDOM-CHARACTERS"
