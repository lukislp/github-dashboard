# Same strategy as the sibling apps on this cluster: default-deny in BOTH directions as the
# baseline, then explicit allowances. The only ingress ever needed is the shared NGINX Gateway
# reaching the pod's port 8000 (k8s/05-httproute.yaml); the only egress is DNS plus HTTPS to
# GitHub (see github-dashboard-egress below). allow-dns used to carry a bare `{}` egress rule
# next to the DNS one, which allowed egress anywhere and made the whole policy decorative -
# removed now that the explicit rules are in place.
#
# Bootstrap-only, NOT Flux-managed - kustomize-controller's ClusterRole has no
# "networkpolicies" permission (same reasoning as k8s/00-namespace.yaml / k8s/02-secret.yaml).
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-ingress
  namespace: github-dashboard
spec:
  podSelector: {}
  policyTypes: ["Ingress"]
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-dns
  namespace: github-dashboard
spec:
  podSelector: {}
  policyTypes: ["Egress"]
  egress:
    - to:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
      ports:
        - { protocol: UDP, port: 53 }
        - { protocol: TCP, port: 53 }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-nginx-gateway-to-app
  namespace: github-dashboard
spec:
  podSelector: { matchLabels: { app: github-dashboard } }
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: nginx-gateway } }
      ports:
        - { protocol: TCP, port: 8000 }
---
# Explicit egress baseline for the whole namespace, mirroring claude-queue's k8s/07-netpol.yaml:
# every pod is isolated for egress, so anything not allowed by a policy below is dropped once
# the catch-all rule in allow-dns is gone.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-egress
  namespace: github-dashboard
spec:
  podSelector: {}
  policyTypes: ["Egress"]
---
# The dashboard's only outbound traffic is HTTPS: the OAuth dance against
# github.com/login/oauth/*, the REST/GraphQL calls against api.github.com, the avatar CDN
# (avatars.githubusercontent.com), and the OpenSSF Scorecard API (api.securityscorecards.dev,
# public scores of public repositories, fetched server side - the browser only talks to this app).
# The GitHub hosts are Cloudflare-fronted anycast addresses that change without notice, and
# NetworkPolicy has no FQDN rule, so the destination stays 0.0.0.0/0 and the port is the
# restriction - same trade-off claude-queue's api-egress makes for the Anthropic API. The
# Scorecard host is covered by this same TCP/443 rule, so no policy change is needed for it.
# Everything else the app needs is local: the session/preference store is SQLite on the PVC
# (DB_PATH=/data/sessions.db), and automountServiceAccountToken is false, so it never talks to
# the Kubernetes API server either.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: github-dashboard-egress
  namespace: github-dashboard
spec:
  podSelector: { matchLabels: { app: github-dashboard } }
  policyTypes: ["Egress"]
  egress:
    - to:
        - ipBlock: { cidr: 0.0.0.0/0 }
      ports:
        - { protocol: TCP, port: 443 }
