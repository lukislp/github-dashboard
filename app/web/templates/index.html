<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>GitHub Dashboard</title>
  <link rel="icon" href="/static/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body data-page="dashboard">
  <header class="topbar">
    <a class="brand" href="/" aria-label="GitHub Dashboard">
      <span class="brand__mark" aria-hidden="true"></span>
      <span class="brand__name">github<span class="brand__sep">/</span>dashboard</span>
    </a>
    <div class="topbar__status" id="topbar-status" aria-live="polite"></div>
    <div class="topbar__actions">
      <button type="button" class="btn" id="refresh" data-i18n="refresh"></button>
      <button type="button" class="btn btn--quiet lang-toggle" id="lang-toggle" aria-label="Language"></button>
      <a class="user" href="{{ user.html_url }}" target="_blank" rel="noopener">
        <img class="user__avatar" src="{{ user.avatar_url }}" alt="" width="24" height="24">
        <span class="user__login">{{ user.login }}</span>
      </a>
      <form method="post" action="/logout" class="inline-form">
        <button type="submit" class="btn btn--quiet" data-i18n="logout"></button>
      </form>
    </div>
  </header>

  <main class="page">
    <div class="banner" id="banner" hidden></div>

    <section class="kpis" id="kpis" aria-label="Totals"></section>

    <section class="inbox" id="inbox" aria-label="Waiting on you"></section>

    <section class="changes" id="changes" aria-label="Changes since last visit" hidden></section>

    <section class="toolbar" aria-label="Filters">
      <label class="search">
        <svg class="icon" viewBox="0 0 16 16" aria-hidden="true"><path d="M11.5 7a4.5 4.5 0 1 1-9 0 4.5 4.5 0 0 1 9 0Zm-.82 4.74a6 6 0 1 1 1.06-1.06l3.04 3.04-1.06 1.06-3.04-3.04Z"/></svg>
        <input type="search" id="filter-q" data-i18n-placeholder="search_placeholder" autocomplete="off">
      </label>
      <select id="filter-owner" class="select" aria-label="Owner"></select>
      <select id="filter-group" class="select" aria-label="Group"></select>
      <button type="button" class="btn btn--quiet" id="manage-groups" data-i18n="manage_groups"></button>
      <div class="chips">
        <label class="chip"><input type="checkbox" id="filter-attention"><span data-i18n="only_attention"></span></label>
        <label class="chip"><input type="checkbox" id="filter-favorites"><span data-i18n="only_favorites"></span></label>
        <label class="chip"><input type="checkbox" id="filter-archived"><span data-i18n="show_archived"></span></label>
        <label class="chip"><input type="checkbox" id="filter-forks" checked><span data-i18n="show_forks"></span></label>
        <label class="chip"><input type="checkbox" id="filter-bots" checked><span data-i18n="show_bots"></span></label>
      </div>
      <div class="toolbar__count" id="repo-count"></div>
    </section>

    <section class="repos" aria-label="Repositories">
      <div class="group-summary" id="group-summary" hidden></div>
      <div class="table-wrap">
        <table class="repo-table" id="repo-table">
          <thead>
            <tr>
              <th class="col-repo"><button type="button" class="sort" data-sort="name" data-i18n="col_repo"></button></th>
              <th class="col-num"><button type="button" class="sort" data-sort="prs" data-i18n="col_prs"></button></th>
              <th class="col-num"><button type="button" class="sort" data-sort="issues" data-i18n="col_issues"></button></th>
              <th class="col-alerts"><button type="button" class="sort" data-sort="alerts" data-i18n="col_alerts"></button></th>
              <th class="col-ci"><button type="button" class="sort" data-sort="ci" data-i18n="col_ci"></button></th>
              <th class="col-pushed"><button type="button" class="sort" data-sort="pushed" data-i18n="col_pushed"></button></th>
              <th class="col-toggle"></th>
            </tr>
          </thead>
          <tbody id="repo-rows"></tbody>
        </table>
      </div>
    </section>

    <section class="failures" aria-labelledby="failures-title">
      <div class="section-head">
        <h2 id="failures-title" data-i18n="failures_title"></h2>
        <p class="section-sub" id="failures-sub"></p>
      </div>
      <ol class="failure-list" id="failure-list"></ol>
    </section>
  </main>

  <footer class="footer" id="footer"></footer>

  <dialog class="dialog" id="groups-dialog"></dialog>

  <script src="/static/i18n.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
