[project]
name = "github-dashboard"
dynamic = ["version"]
description = "Multi-user GitHub overview: repositories, open pull requests, open issues and failed Actions at a glance."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "httpx>=0.27",
  "jinja2>=3.1",
  "itsdangerous>=2.2",
  "cryptography>=43",
  "redis>=5.0",
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
  "fakeredis>=2.24",
  "ruff>=0.6",
]

[build-system]
requires = ["hatchling", "hatch-vcs"]
build-backend = "hatchling.build"

[tool.hatch.version]
source = "vcs"

[tool.hatch.version.raw-options]
# Falls back to this version when no git metadata is available (e.g. the Docker build
# context only copies pyproject.toml/app, never .git) instead of failing the build.
fallback_version = "0.0.0"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "ASYNC"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
